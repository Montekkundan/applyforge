services:
  yew-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.yew
    command: bash -c "cd frontend && trunk serve --address 0.0.0.0 --port ${TRUNK_SERVE_PORT:-80}"
    environment:
      - ACTIX_PORT=${ACTIX_PORT:-8080}
      - TRUNK_SERVE_PORT=${TRUNK_SERVE_PORT:-80}
      - ENABLE_OAUTH=true
      - LOGIN_URL=http://localhost:${ACTIX_PORT:-8080}/login
    ports:
      - "${TRUNK_SERVE_PORT:-80}:${TRUNK_SERVE_PORT:-80}"
    volumes:
      - ../frontend:/app/frontend
      - yew-ui-target-cache:/app/frontend/target
      - yew-ui-cargo-registry-cache:/usr/local/cargo/registry
    depends_on:
      - actix-api

  actix-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.actix
    command: bash -c "cd backend && cargo watch -x 'run'"
    environment:
      - ACTIX_PORT=${ACTIX_PORT:-8080}
      - DATABASE_URL=postgres://postgres:docker@postgres:5432/actix-api-db?sslmode=disable
      - RUST_LOG=info
    ports:
      - "${ACTIX_PORT:-8080}:${ACTIX_PORT:-8080}"
    volumes:
      # - ../backend:/app/backend  # Removed to avoid Docker volume conflict
      - actix-api-target-cache:/app/backend/target
      - actix-api-cargo-registry-cache:/usr/local/cargo/registry
    depends_on:
      - postgres

  postgres:
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: "docker"
      POSTGRES_DB: "actix-api-db"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  actix-api-cargo-registry-cache:
  actix-api-target-cache:
  yew-ui-target-cache:
  yew-ui-cargo-registry-cache:
  pgdata:
